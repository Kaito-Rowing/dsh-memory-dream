name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare test stub for @deepseek-ai/dsh-tools
        run: node test/setup.mjs
      - name: Copy plugin source next to tests
        run: cp lib/index.js test/plugin.mjs
      - name: Run tests
        run: node --test test/plugin.test.mjs
