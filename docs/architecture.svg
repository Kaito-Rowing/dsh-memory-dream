<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">dsh-memory-dream architecture</title>
<desc id="desc">Two distinct flows: each turn the capped MEMORY.md index and wiki topic list can be injected into prompt context when the system prompt service exists. On demand, memory_dream gathers memory, sessions, notes, and prior dreams. The agent reviews material, uses memory tools for edits, and can write dream records or synthesis. Review is not automatic.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F6F8FD"/><stop offset="1" stop-color="#EDF3FA"/></linearGradient>
  <marker id="arrowB" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#6274AD" stroke-width="1.5"/></marker>
  <marker id="arrowG" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#158B7B" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="720" rx="16" fill="url(#bg)"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<text x="48" y="51" fill="#536585" font-size="12" font-weight="700" letter-spacing="2.2">ARCHITECTURE / TWO DIFFERENT PATHS</text>
<text x="48" y="93" fill="#1A2945" font-size="32" font-weight="750">Stored memory and evidence-based review</text>
<text x="49" y="121" fill="#5F708A" font-size="15">The plugin supplies storage and evidence. The agent makes the decisions.</text>
<!-- Turn-by-turn injection lane -->
<rect x="40" y="152" width="1120" height="194" rx="17" fill="#FFFFFF" stroke="#DAE3F1"/>
<rect x="59" y="170" width="100" height="23" rx="11.5" fill="#EAE7FF"/>
<text x="109" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#5548AB" letter-spacing=".6">EACH TURN</text>
<text x="171" y="186" fill="#75839A" font-size="12">only when the DSH systemPrompt service is present</text>
<rect x="67" y="217" width="286" height="93" rx="12" fill="#F4F2FF" stroke="#ADA3EE" stroke-width="1.5"/>
<text x="89" y="247" fill="#353064" font-size="19" font-weight="750">MEMORY.md</text>
<text x="89" y="269" fill="#646581" font-size="13">4,000-char cap by default</text>
<text x="89" y="288" fill="#646581" font-size="13">+ wiki topic index</text>
<path d="M367 263 H426" stroke="#6274AD" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>
<text x="395" y="249" text-anchor="middle" font-size="11" fill="#60719F">inject</text>
<rect x="443" y="217" width="292" height="93" rx="12" fill="#EAF1FF" stroke="#93B1E9" stroke-width="1.5"/>
<text x="466" y="247" fill="#1D477E" font-size="18" font-weight="750">Prompt context</text>
<text x="466" y="269" fill="#5A7495" font-size="13">via systemPrompt.context</text>
<text x="466" y="288" fill="#5A7495" font-size="13">guarded before injection</text>
<path d="M750 263 H808" stroke="#6274AD" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>
<rect x="825" y="217" width="303" height="93" rx="12" fill="#1C2947" stroke="#1C2947"/>
<text x="850" y="247" fill="#F4F7FF" font-size="19" font-weight="750">Agent turn</text>
<text x="850" y="269" fill="#C2CBE0" font-size="13">Relevant index already in context</text>
<text x="850" y="288" fill="#C2CBE0" font-size="13">wiki details fetched on demand</text>
<!-- On-demand review lane -->
<rect x="40" y="368" width="1120" height="313" rx="17" fill="#FFFFFF" stroke="#DAE3F1"/>
<rect x="59" y="386" width="119" height="23" rx="11.5" fill="#DDF7F1"/>
<text x="118" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#0C7C68" letter-spacing=".6">ON DEMAND</text>
<text x="192" y="402" fill="#75839A" font-size="12">memory_dream assembles material; it does not run or reason by itself</text>
<!-- Source cards -->
<g font-size="13" font-weight="700">
<rect x="64" y="434" width="160" height="63" rx="10" fill="#F6F4FF" stroke="#C5BDF1"/>
<text x="82" y="459" fill="#463F86">MEMORY.md</text><text x="82" y="478" font-size="11" font-weight="400" fill="#7B769C">current claims</text>
<rect x="238" y="434" width="160" height="63" rx="10" fill="#EDF9F6" stroke="#AAE4D5"/>
<text x="256" y="459" fill="#0F7568">sessions/</text><text x="256" y="478" font-size="11" font-weight="400" fill="#5A8A80">conversation text*</text>
<rect x="64" y="510" width="160" height="63" rx="10" fill="#F2F6FC" stroke="#CDDBE9"/>
<text x="82" y="535" fill="#405B7C">notes/</text><text x="82" y="554" font-size="11" font-weight="400" fill="#758BA4">dated context</text>
<rect x="238" y="510" width="160" height="63" rx="10" fill="#F2F6FC" stroke="#CDDBE9"/>
<text x="256" y="535" fill="#405B7C">past dreams</text><text x="256" y="554" font-size="11" font-weight="400" fill="#758BA4">prior decisions</text>
</g>
<path d="M409 500 H451" stroke="#158B7B" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>
<rect x="468" y="444" width="240" height="119" rx="13" fill="#E4F7F3" stroke="#7FCBBA" stroke-width="1.8"/>
<text x="490" y="473" fill="#146E64" font-size="18" font-weight="750">memory_dream</text>
<text x="490" y="495" fill="#477C75" font-size="12.5">collects + scans material</text>
<path d="M489 518 H687" stroke="#A8D8CE" stroke-width="1"/>
<text x="490" y="539" fill="#386F64" font-size="12">returns evidence to the model</text>
<path d="M723 500 H764" stroke="#158B7B" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>
<rect x="781" y="444" width="346" height="119" rx="13" fill="#1C2947" stroke="#1C2947"/>
<text x="804" y="474" fill="#FFFFFF" font-size="18" font-weight="750">Agent reviews the evidence</text>
<text x="804" y="499" fill="#CDD6E7" font-size="13">support / contradiction / unresolved</text>
<text x="804" y="521" fill="#CDD6E7" font-size="13">No forced resolution without evidence</text>
<!-- outcomes -->
<path d="M896 566 V590 H650 V609 M1010 590 V609" stroke="#6274AD" fill="none" stroke-width="1.8" marker-end="url(#arrowB)"/>
<rect x="504" y="616" width="291" height="42" rx="9" fill="#F4F2FF" stroke="#C7BEF5"/>
<text x="649" y="642" text-anchor="middle" fill="#403985" font-size="13" font-weight="700">memory tools → edit index / wiki</text>
<rect x="819" y="616" width="308" height="42" rx="9" fill="#EDF9F6" stroke="#AAE4D5"/>
<text x="973" y="642" text-anchor="middle" fill="#176F65" font-size="13" font-weight="700">dream record / synthesis → write</text>
<text x="65" y="641" fill="#7A879C" font-size="11.5">* Transcript support needs Node 22.15+.</text>
<text x="65" y="657" fill="#7A879C" font-size="11.5">Workspace filtering may fall back to all workspaces.</text>
</g>
</svg>
